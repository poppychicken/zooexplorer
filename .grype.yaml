# Scan exceptions for the image CVE gate in .github/workflows/{pr,ci}.yml.
# Auto-detected by grype — no wiring needed.
#
# Keep this file short and every entry justified by a REMEDIATION, not by an
# opinion about severity. An exception list that grows on judgement calls turns
# the scan into a formality, which is worse than not running it — the failing
# build is the control.
#
# Scope each entry to a single CVE and say when it can be deleted. Never mute a
# severity wholesale.
#
# The gate already ignores anything with no upstream fix (only-fixed: true), so
# an entry here means "there IS a fix and we are deliberately not taking it" —
# which needs a reason a reviewer would accept.
#
# Shape of an entry:
#
# ignore:
#   # CVE-0000-00000 — <what it is>.
#   #
#   # Why not fixed: <the upstream/compat blocker, with the date you checked>
#   # Why safe here: <why this image cannot reach the vulnerable path>
#   # Delete when: <the concrete event that resolves it>
#   - vulnerability: CVE-0000-00000

ignore:
  # CVE-2026-85091 / GHSA-g5fp-32jq-cfw2 — the same zlib advisory under two ids.
  # grype reports both rows, so both are listed; muting only the CVE leaves the
  # GHSA row in the table.
  #
  # Why not fixed: the fix is zlib 1.3.3-r0 and no Chainguard python:3.13 image
  #   ships it yet. Checked 2026-09-15: the newest platform-base py313 tag
  #   (2026.09.14-419) still carries zlib 1.3.2-r6, and platform-base is already
  #   as current as it can be — Renovate bumped its pinned upstream digest to
  #   a3217a4 on 2026-09-14 and has no PR outstanding. There is no tag we could
  #   move to that clears this.
  # Why safe here: nothing in this repo can action it. zlib arrives entirely
  #   from the base image; this app has no pinned copy of its own to bump.
  #   Note this is NOT a reachability argument — Python's zlib module backs
  #   gzip and HTTP content-encoding, so assume the code path is live.
  # Delete when: platform-base publishes a py313 tag carrying zlib >= 1.3.3-r0.
  #   SELF-EXPIRING — the `version` below is pinned deliberately, so the moment
  #   the apk moves off 1.3.2-r6 these entries stop matching and the gate
  #   enforces again with no cleanup needed. That is the same mechanism the
  #   other platform-base consumers use, and it is why the entry is pinned to a
  #   version rather than muting the CVE outright: an unpinned ignore would keep
  #   suppressing this advisory forever, including after it is fixed.
  #
  #   The trade-off is deliberate. If a base ships 1.3.2-r7 that is still
  #   vulnerable, these stop matching and the gate goes red on something still
  #   unfixable — the entry then gets re-pinned to r7 with the date re-checked.
  #   Erring toward enforcement is the point; a stale mute is the failure mode
  #   this file's own header warns about.
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
      version: 1.3.2-r6
      type: apk
  - vulnerability: GHSA-g5fp-32jq-cfw2
    package:
      name: zlib
      version: 1.3.2-r6
      type: apk
