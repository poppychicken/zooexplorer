# Local-dev config. Copy to config.yaml and edit.
#
# Deployed pods do NOT use this file: the chart injects MONGODB_URI and
# MONGODB_DATABASE as environment variables, and env always wins over YAML.
#
# There is no oauth section — the app never authenticates anyone. Identity
# arrives per request as SSO headers from the platform gateway.

mongodb:
  uri: "mongodb://localhost:27017"
  database: "{{MONGODB_DATABASE}}"

app:
  # Informational only — where this app lives.
  url: "http://localhost:8080"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
