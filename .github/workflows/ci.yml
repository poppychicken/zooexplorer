name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_TAG: v1.0.${{ github.run_number }}

permissions:
  id-token: write
  contents: read

jobs:
  preflight:
    name: Check bootstrapped
    if: github.event.repository.is_template == false
    runs-on: ubuntu-latest
    outputs:
      bootstrapped:  ${{ steps.check.outputs.bootstrapped }}
      project_name:  ${{ steps.check.outputs.project_name }}
      owner_github:  ${{ steps.check.outputs.owner_github }}
      owner_email:   ${{ steps.check.outputs.owner_email }}
      regions:       ${{ steps.check.outputs.regions }}
      environments:  ${{ steps.check.outputs.environments }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if [ ! -f .platform/setup.json ]; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::.platform/setup.json missing — repo not bootstrapped yet. Skipping build."
            exit 0
          fi
          echo "bootstrapped=true"                                                       >> "$GITHUB_OUTPUT"
          echo "project_name=$(jq -r .project.name           .platform/setup.json)"      >> "$GITHUB_OUTPUT"
          echo "owner_github=$(jq -r .owner.github           .platform/setup.json)"      >> "$GITHUB_OUTPUT"
          echo "owner_email=$(jq -r  .owner.email            .platform/setup.json)"      >> "$GITHUB_OUTPUT"
          echo "regions=$(jq -c '[.deployment.targets[].region]' .platform/setup.json)"  >> "$GITHUB_OUTPUT"
          echo "environments=$(jq -c .deployment.environments    .platform/setup.json)"  >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push (${{ matrix.region }})
    needs: preflight
    if: needs.preflight.outputs.bootstrapped == 'true'
    # In-VPC ARC pool: the only runners that can reach npm.shared-dev (and ECR).
    # GitHub-hosted runners cannot — the registry is internal, and a build there
    # dies on a connect timeout.
    runs-on: github-action
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.preflight.outputs.regions) }}
    env:
      ECR_REPOSITORY: ${{ needs.preflight.outputs.project_name }}
      OWNER_GITHUB:   ${{ needs.preflight.outputs.owner_github }}
      OWNER_EMAIL:    ${{ needs.preflight.outputs.owner_email }}
      PROJECT_NAME:   ${{ needs.preflight.outputs.project_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" 2>/dev/null || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true

      # The Verdaccio bot role is assumed ONLY to read the SSM parameter and is
      # dropped again immediately after — the build itself never holds it.
      - name: Assume Verdaccio bot role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::936610309108:role/gha-verdaccio-npm-bot
          aws-region: us-east-1

      - name: Mint Verdaccio token
        id: verdaccio
        run: |
          set -euo pipefail
          PW=$(aws ssm get-parameter \
                 --name /verdaccio/github-ci-bot/password \
                 --with-decryption \
                 --query Parameter.Value --output text)
          echo "::add-mask::$PW"
          TOK=$(curl -sSf -X PUT \
                 https://npm.shared-dev.swipejobs.com/-/user/org.couchdb.user:github-ci-bot \
                 -u "github-ci-bot:$PW" \
                 -H 'Content-Type: application/json' \
                 -d "{\"name\":\"github-ci-bot\",\"password\":\"$PW\"}" \
                 | jq -r .token)
          # Mask BEFORE the token can reach any later log line.
          echo "::add-mask::$TOK"
          if [ -z "$TOK" ] || [ "$TOK" = "null" ]; then
            echo "ERROR: failed to mint verdaccio token"
            exit 1
          fi
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Re-assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      # buildx + QEMU so the amd64 pin below can be emulated on this arm64 pool.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REGION: ${{ matrix.region }}
          VERDACCIO_TOKEN: ${{ steps.verdaccio.outputs.token }}
          DOCKER_BUILDKIT: "1"
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --provenance=false \
            --secret id=npm_token,env=VERDACCIO_TOKEN \
            --label "owner=${OWNER_GITHUB}" \
            --label "owner.email=${OWNER_EMAIL}" \
            --label "project=${PROJECT_NAME}" \
            --label "region=${REGION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      # Gate BEFORE the push, not after: an image that fails here never
      # reaches ECR, so nothing can deploy it while a fix is prepared. grype
      # reads the image from the local docker daemon, which already holds ECR
      # credentials from the login step above.
      #
      # Repo-local .grype.yaml is auto-detected for exceptions — keep entries
      # scoped to a CVE with a stated remediation, never a blanket severity
      # mute. only-fixed: a CVE with no upstream patch cannot be actioned by
      # the app owner and would pin the pipeline red.
      - name: Scan image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity-cutoff: medium
          only-fixed: true
          fail-build: true
          output-format: table
          by-cve: true
          cache-db: true

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ---------------------------------------------------------------------------
  # Register the image with app-summary so it appears in the vulnerability
  # tracker. Without this a selfserve app is invisible there — every one of
  # them 404s today — so nothing watches its CVEs after the build-time gate.
  #
  # Two posts, and they MUST agree on the identifier. release-data writes
  # ServiceVersions.partner_envs.<partner>.<env> = <tag>, and the scanner looks
  # up the SBOM by that same value (_resolve_full_build_id returns a
  # non-numeric slot id unchanged, and semver tags are preserved). Post a
  # different buildId to sbom-data and the slot resolves to nothing, which
  # renders as "unscanned" rather than as an error.
  #
  # Runs once, not per region: the matrix pushes the same tag to each region
  # and the tracker holds one record per (service, partner, env).
  register-sbom:
    name: Register SBOM with app-summary
    needs: [preflight, build]
    # In-VPC pool: app-summary resolves to a private address and is not
    # reachable from GitHub-hosted runners.
    runs-on: github-action
    if: |
      needs.preflight.outputs.bootstrapped == 'true' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: ${{ needs.preflight.outputs.project_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # syft pinned by DIGEST — a mutable :latest here is third-party code
      # execution on a credentialed runner. Read through the registry API
      # rather than a docker.sock mount, so the container gets read-only
      # registry auth and nothing else. Auth rides env vars, not a bind-mounted
      # config.json, which would resolve on the daemon's filesystem.
      - name: Generate SBOM
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          SYFT_REGISTRY_AUTH_PASSWORD=$(aws ecr get-login-password)
          echo "::add-mask::${SYFT_REGISTRY_AUTH_PASSWORD}"
          export SYFT_REGISTRY_AUTH_PASSWORD
          export SYFT_REGISTRY_AUTH_AUTHORITY="${ECR_REGISTRY}"
          export SYFT_REGISTRY_AUTH_USERNAME="AWS"
          docker run --rm \
            -e SYFT_REGISTRY_AUTH_AUTHORITY \
            -e SYFT_REGISTRY_AUTH_USERNAME \
            -e SYFT_REGISTRY_AUTH_PASSWORD \
            anchore/syft:v1.19.0@sha256:bc1ae555a43011d23bb011a4f50e175fc9a5984a008a3f8f2d692b211fcacd2a \
            "registry:${IMAGE_URI}" -o cyclonedx-json > sbom.json
          echo "SBOM: $(wc -c < sbom.json) bytes"

      # Best-effort by design: the image is already pushed by this point, and a
      # tracker outage must not block a deploy. It is `continue-on-error`
      # rather than `|| true` so a failure still shows up amber in the run
      # summary instead of vanishing — silent failure here is precisely how
      # these apps went unwatched in the first place.
      - name: Post SBOM and release to app-summary
        continue-on-error: true
        env:
          SERVICE: ${{ needs.preflight.outputs.project_name }}
        run: python3 .github/scripts/register_sbom.py

  notify-gitops:
    # Fires a `selfserve-bump-tag` repository_dispatch into
    # swipejobs/platform-gitops. The receiver workflow there
    # (`selfserve-bump-tag.yml`) validates the payload, updates
    # 3-platform/selfserve/<name>.yaml `image.tag`, and opens a PR. DevOps merges →
    # ArgoCD picks up the new tag and rolls the Deployment.
    #
    # Replaces the placeholder `deploy-dev` echo with the real
    # mechanism. The dispatch fires ONCE per push (not per matrix
    # region) — the registry entry has one `image.tag` and the same
    # IMAGE_TAG is pushed across regions, so a single bump suffices.
    #
    # Auth: short-lived installation token from the
    # `backend-service-config-app` GitHub App (same pattern as
    # bootstrap.yml). App's installation MUST include
    # platform-gitops with `contents: write` +
    # `metadata: read` so the cross-repo dispatch endpoint accepts it.
    name: Notify platform-gitops
    needs: [preflight, build]
    runs-on: ubuntu-latest
    if: |
      needs.preflight.outputs.bootstrapped == 'true' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(needs.preflight.outputs.environments), 'dev')
    env:
      ECR_REPOSITORY: ${{ needs.preflight.outputs.project_name }}
    steps:
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOOTSTRAP_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform-gitops

      - name: Fire selfserve-bump-tag dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP: ${{ env.ECR_REPOSITORY }}
          TAG: ${{ env.IMAGE_TAG }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg app "$APP" \
            --arg tag "$TAG" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run "$SOURCE_RUN" \
            --arg url "$SOURCE_RUN_URL" \
            '{
              event_type: "selfserve-bump-tag",
              client_payload: {
                app: $app,
                tag: $tag,
                source_commit: $commit,
                source_run: $run,
                source_run_url: $url
              }
            }')
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/platform-gitops/dispatches" \
            -d "$PAYLOAD"
          echo "  → Dispatched selfserve-bump-tag: app=$APP tag=$TAG"
