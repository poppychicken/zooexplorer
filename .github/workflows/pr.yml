name: PR validation

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint & build
    # In-VPC ARC pool: the only runners that can reach npm.shared-dev (and ECR).
    # GitHub-hosted runners cannot — the registry is internal, and a build there
    # dies on a connect timeout.
    runs-on: github-action
    # id-token is needed to mint the npm registry token below.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Verdaccio bot role is assumed ONLY to read the SSM parameter and is
      # dropped again immediately after — the build itself never holds it.
      #
      # Safe on pull_request: GitHub withholds secrets and refuses an OIDC
      # token for fork PRs, so this step simply cannot run for an outside
      # contributor. It is `pull_request`, never `pull_request_target`.
      - name: Assume Verdaccio bot role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::936610309108:role/gha-verdaccio-npm-bot
          aws-region: us-east-1

      - name: Mint Verdaccio token
        id: verdaccio
        run: |
          set -euo pipefail
          PW=$(aws ssm get-parameter \
                 --name /verdaccio/github-ci-bot/password \
                 --with-decryption \
                 --query Parameter.Value --output text)
          echo "::add-mask::$PW"
          TOK=$(curl -sSf -X PUT \
                 https://npm.shared-dev.swipejobs.com/-/user/org.couchdb.user:github-ci-bot \
                 -u "github-ci-bot:$PW" \
                 -H 'Content-Type: application/json' \
                 -d "{\"name\":\"github-ci-bot\",\"password\":\"$PW\"}" \
                 | jq -r .token)
          # Mask BEFORE the token can reach any later log line.
          echo "::add-mask::$TOK"
          if [ -z "$TOK" ] || [ "$TOK" = "null" ]; then
            echo "ERROR: failed to mint verdaccio token"
            exit 1
          fi
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: frontend
        env:
          NPM_TOKEN: ${{ steps.verdaccio.outputs.token }}
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      # No database needed — the tests cover the SSO header contract, the
      # SPA fallback and request validation.
      - name: Pytest
        working-directory: backend
        run: pytest -q

  docker:
    name: Docker build (no push)
    # In-VPC ARC pool: the only runners that can reach npm.shared-dev (and ECR).
    # GitHub-hosted runners cannot — the registry is internal, and a build there
    # dies on a connect timeout.
    runs-on: github-action
    # id-token so the build can assume the ECR role: the Dockerfile's Python
    # stages come from the private platform-base repository, so an
    # unauthenticated build cannot even pull its base image.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # Registers binfmt on the host so the amd64 image built below can also be
      # RUN here for the smoke test — this pool is arm64. buildx brings its own
      # emulation for the build; `docker run` needs the host handler.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The Verdaccio bot role is assumed ONLY to read the SSM parameter and is
      # dropped again immediately after — the build itself never holds it.
      #
      # Safe on pull_request: GitHub withholds secrets and refuses an OIDC
      # token for fork PRs, so this step simply cannot run for an outside
      # contributor. It is `pull_request`, never `pull_request_target`.
      - name: Assume Verdaccio bot role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::936610309108:role/gha-verdaccio-npm-bot
          aws-region: us-east-1

      - name: Mint Verdaccio token
        id: verdaccio
        run: |
          set -euo pipefail
          PW=$(aws ssm get-parameter \
                 --name /verdaccio/github-ci-bot/password \
                 --with-decryption \
                 --query Parameter.Value --output text)
          echo "::add-mask::$PW"
          TOK=$(curl -sSf -X PUT \
                 https://npm.shared-dev.swipejobs.com/-/user/org.couchdb.user:github-ci-bot \
                 -u "github-ci-bot:$PW" \
                 -H 'Content-Type: application/json' \
                 -d "{\"name\":\"github-ci-bot\",\"password\":\"$PW\"}" \
                 | jq -r .token)
          # Mask BEFORE the token can reach any later log line.
          echo "::add-mask::$TOK"
          if [ -z "$TOK" ] || [ "$TOK" = "null" ]; then
            echo "ERROR: failed to mint verdaccio token"
            exit 1
          fi
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      # Drop the Verdaccio role again. The ECR login above already wrote its
      # own credentials into the docker config, so the build can still pull the
      # private base image without this job holding npm-bot rights throughout.
      - name: Re-assume the ECR role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pr-validation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # This pool is arm64, but these apps are deployed with no arch
          # nodeSelector and land on amd64 nodes. Building native here would
          # produce an arm64-only image that ImagePullBackOffs in the cluster,
          # so the platform is pinned to match where the pods actually run.
          platforms: linux/amd64
          # Delivered as a BuildKit secret — never a build-arg, which would be
          # readable in the built image's history.
          secrets: |
            npm_token=${{ steps.verdaccio.outputs.token }}

      # Same gate as ci.yml, run before the change can merge. Repo-local
      # .grype.yaml is auto-detected for exceptions — keep entries scoped to a
      # CVE with a stated remediation, never a blanket severity mute.
      #
      # only-fixed: a CVE with no upstream patch cannot be actioned by the app
      # owner and would pin every PR red.
      - name: Scan image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: pr-validation:${{ github.sha }}
          severity-cutoff: medium
          only-fixed: true
          fail-build: true
          output-format: table
          by-cve: true
          cache-db: true
      # Catches the class of bug a build alone cannot: an image that only
      # starts as root, or a missing SPA bundle.
      - name: Smoke test as non-root with a read-only rootfs
        run: |
          docker run -d --name smoke -p 8080:8080 \
            --platform linux/amd64 \
            --user 65532:65532 --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            pr-validation:${{ github.sha }}
          # 120s, not 30: the container is amd64 under QEMU on an arm64 runner,
          # so interpreter startup is several times slower than native.
          for i in $(seq 1 120); do
            curl -sf http://localhost:8080/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health | grep -q '"ok"'
          curl -sf -o /dev/null http://localhost:8080/          # SPA shell
          curl -sf -o /dev/null http://localhost:8080/items     # SPA deep link
          docker rm -f smoke
