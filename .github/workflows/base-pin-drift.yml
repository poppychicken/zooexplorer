name: Base pin drift

# The two `ARG PLATFORM_BASE*_VERSION` pins in the Dockerfile are bare version
# strings, not `image:tag@digest` refs. Renovate's docker manager cannot match
# that shape, and renovate.json explicitly disables the platform-base package,
# so without this job NOTHING moves those pins — they stay at whatever the
# scaffold shipped.
#
# platform-base, meanwhile, is rebuilt continuously: Renovate bumps its pinned
# Chainguard digests and each merge publishes a new tag carrying that day's OS
# patches. So the base collects CVE fixes while this repo keeps building on a
# months-old tag, and the first symptom is the grype gate in pr.yml failing on
# an inherited `python-3.*` advisory that no change in this repo can fix. That
# happened on 2026-09-07: pins frozen at 2026.08.26-128 (python-3.13.15-r1)
# while the base had reached r7, past the r5/r6 that fixed the two CVEs the
# gate was reporting.
#
# This job closes that loop. Weekly it compares the pins against the newest
# tags in ECR, scans the candidate with the SAME settings pr.yml uses, and
# opens a bump PR only if the candidate passes. It never proposes a bump that
# would land red.
#
# Deliberately not Renovate: tracking an ECR tag needs Renovate to hold AWS
# credentials, which nothing in this org does today. This job reuses the OIDC
# role the repo already has, so it needs no new secret. renovate.json handles
# everything Renovate CAN see (node stage, npm/pip, actions) and disables the
# platform-base package outright, so the two never rewrite the same lines.
#
# This is the canonical copy: the self-serve apps are scaffolded from here and
# carry the same two files. Fix things here and propagate, rather than letting
# each repo's copy drift — which is exactly what had happened before DOPS-9430.

on:
  schedule:
    # Mondays 06:17 UTC — offset off the hour so it does not pile onto the
    # top-of-hour scheduling spike, which delays cron runs on busy orgs.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  id-token: write         # OIDC into AWS for the ECR read
  contents: write         # push the bump branch
  pull-requests: write    # open the bump PR

# One at a time: two overlapping runs would race on the same branch name.
concurrency:
  group: base-pin-drift
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Pinned, and invoked by absolute path below: these are self-hosted runners
  # with a persistent home, where a stale grype already on PATH would silently
  # shadow this pin and scan against an old vulnerability database.
  GRYPE_VERSION: v0.111.1
  BRANCH: chore/base-pin-drift

jobs:
  drift:
    name: Check platform-base pins
    runs-on: github-action

    steps:
      - uses: actions/checkout@v7

      # Fail with the actual reason rather than an opaque OIDC error, which is
      # what a freshly generated app hits before bootstrap has run.
      - name: Require AWS role
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "AWS_ROLE_ARN is not set — this repo cannot read ECR yet."
            echo "It is configured by bootstrap; re-run this job afterwards."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Reads the pins AND the variant suffixes out of the Dockerfile, so an
      # app generated on py311/py312/py314 needs no change here.
      - name: Detect drift
        id: drift
        run: python3 .github/scripts/check_base_pin_drift.py

      - name: Install grype (pinned)
        if: steps.drift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            | sh -s -- -b "$RUNNER_TEMP/grype-bin" "$GRYPE_VERSION"
          "$RUNNER_TEMP/grype-bin/grype" version

      # The same gate pr.yml applies, run against the candidate base before it
      # is proposed. `registry:` reads the manifest directly, so this needs no
      # docker daemon; auth comes from an explicit ECR password rather than the
      # docker config, so it does not depend on a prior docker login step.
      #
      # linux/amd64 because that is the platform pr.yml and ci.yml build.
      #
      # A failure here is NOT this repo's problem to fix: it means the newest
      # platform-base tag itself ships a fixed-in advisory. The job fails on
      # purpose so that lands in someone's inbox instead of a step summary
      # nobody opens.
      - name: Gate the candidate base image
        if: steps.drift.outputs.changed == 'true'
        env:
          CANDIDATE: ${{ steps.drift.outputs.candidate_image }}
        run: |
          set -euo pipefail
          GRYPE_REGISTRY_AUTH_AUTHORITY="${CANDIDATE%%/*}"
          GRYPE_REGISTRY_AUTH_USERNAME=AWS
          GRYPE_REGISTRY_AUTH_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
          # Registered before the value can reach a log. It is a live bearer
          # token for ~12 hours, and nothing here prints it today — but a later
          # `set -x` or a verbose grype flag would, and the mask makes that safe.
          echo "::add-mask::$GRYPE_REGISTRY_AUTH_PASSWORD"
          export GRYPE_REGISTRY_AUTH_AUTHORITY GRYPE_REGISTRY_AUTH_USERNAME GRYPE_REGISTRY_AUTH_PASSWORD
          if ! "$RUNNER_TEMP/grype-bin/grype" "registry:${CANDIDATE}" \
                 --platform linux/amd64 --fail-on medium --only-fixed --by-cve \
                 -o table | tee "$RUNNER_TEMP/candidate-scan.txt"; then
            {
              echo "### Candidate base image is not clean"
              echo
              echo "\`${CANDIDATE}\` reports advisories that have an available fix,"
              echo "so no bump PR was opened. This is a platform-base problem, not an"
              echo "application one — the base should not publish a tag in this state."
              echo
              echo '```'
              cat "$RUNNER_TEMP/candidate-scan.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The versions are passed in, not looked up again. This is a second
      # process, and a bare --apply would re-query ECR: platform-base is
      # rebuilt continuously, so a tag published during the scan above would be
      # written to the Dockerfile having never been gated, while the commit and
      # PR body below still quote the tag that was.
      - name: Apply the bump
        if: steps.drift.outputs.changed == 'true'
        env:
          DEV_LATEST: ${{ steps.drift.outputs.dev_latest }}
          RUNTIME_LATEST: ${{ steps.drift.outputs.runtime_latest }}
          HAS_DEV: ${{ steps.drift.outputs.has_dev }}
        run: |
          set -euo pipefail
          # --dev-version is passed iff the Dockerfile has a dev pin. A JVM app
          # builds its jar in a gradle stage and has none; passing "n/a" there
          # would write a pin no FROM line consumes.
          if [ "$HAS_DEV" = "true" ]; then
            python3 .github/scripts/check_base_pin_drift.py --apply \
              --dev-version "$DEV_LATEST" --runtime-version "$RUNTIME_LATEST"
          else
            python3 .github/scripts/check_base_pin_drift.py --apply \
              --runtime-version "$RUNTIME_LATEST"
          fi

      # Force-push a single long-lived branch: if last week's PR is still open
      # and unmerged, this refreshes it in place instead of accumulating one
      # stale PR per week.
      - name: Open or refresh the bump PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_CURRENT: ${{ steps.drift.outputs.dev_current }}
          DEV_LATEST: ${{ steps.drift.outputs.dev_latest }}
          RUNTIME_CURRENT: ${{ steps.drift.outputs.runtime_current }}
          RUNTIME_LATEST: ${{ steps.drift.outputs.runtime_latest }}
          HAS_DEV: ${{ steps.drift.outputs.has_dev }}
          CANDIDATE: ${{ steps.drift.outputs.candidate_image }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rendered only when the Dockerfile actually has a dev pin, otherwise
          # the commit message and PR table would claim an "n/a -> n/a" bump.
          if [ "$HAS_DEV" = "true" ]; then
            DEV_TRAILER="PLATFORM_BASE_DEV_VERSION  ${DEV_CURRENT} -> ${DEV_LATEST}"
            DEV_ROW="| \`PLATFORM_BASE_DEV_VERSION\` | \`${DEV_CURRENT}\` | \`${DEV_LATEST}\` |"
          else
            DEV_TRAILER=""
            DEV_ROW=""
          fi

          git checkout -B "$BRANCH"
          git add Dockerfile
          git commit -m "chore: bump platform-base pins to ${RUNTIME_LATEST}" \
                     -m "${DEV_TRAILER}
          PLATFORM_BASE_VERSION      ${RUNTIME_CURRENT} -> ${RUNTIME_LATEST}

          Opened by the base-pin-drift job. ${CANDIDATE} passed the same grype
          gate pr.yml applies (severity-cutoff medium, only-fixed, by-cve)
          before this PR was raised."
          # --force, not --force-with-lease. actions/checkout fetches a single
          # branch, so the remote's fetch refspec does not cover $BRANCH, git
          # cannot resolve a lease for it, and the push is rejected as "stale
          # info" every run after the branch first exists — which killed the
          # refresh path outright. Fetching the ref first does not rescue the
          # lease: syncing immediately before pushing makes it always match, so
          # it protects nothing. This branch is owned solely by this job and
          # rebuilt from the default branch on every run.
          git push --force origin "$BRANCH"

          # Written to a file rather than captured with BODY=$(cat <<EOF ...).
          # A here-document nested inside command substitution is only parsed
          # correctly by bash >= 5.2: earlier versions scan for the closing
          # paren without understanding the here-document, so the apostrophe
          # in "The PR's own CI" below reads as an unterminated quote and the
          # whole step dies with a syntax error. --body-file keeps the
          # here-document at the top level, where no bash version cares.
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated by \`.github/workflows/base-pin-drift.yml\`.

          | pin | from | to |
          |---|---|---|
          ${DEV_ROW}
          | \`PLATFORM_BASE_VERSION\` | \`${RUNTIME_CURRENT}\` | \`${RUNTIME_LATEST}\` |

          \`${CANDIDATE}\` was scanned with the same settings \`pr.yml\` uses —
          \`severity-cutoff: medium\`, \`only-fixed: true\`, \`by-cve: true\` — and
          reported nothing before this PR was opened.

          **That scan covered the base image only, and this PR has no CI of its
          own.** It was opened with \`GITHUB_TOKEN\`, and GitHub does not start
          workflow runs for events raised by that token, so \`pr.yml\` — the job
          that scans the built *application* image, app dependencies included —
          has not run and will not run on its own. Before merging, trigger it
          by closing and reopening this PR (or push any commit to the branch)
          and confirm it is green.

          These pins are bare version strings, so Renovate cannot see them — and
          \`renovate.json\` disables the platform-base package so it does not try.
          Without this job they stay frozen at whatever the scaffold shipped while
          platform-base keeps publishing patched tags — which is how the gate ended
          up red on inherited \`python-3.13\` CVEs on 2026-09-07.
          EOF
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "refreshed existing PR"
          else
            gh pr create --head "$BRANCH" \
              --title "chore: bump platform-base pins to ${RUNTIME_LATEST}" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

      - name: Summary
        if: always() && steps.drift.outputs.changed == 'false'
        run: echo "platform-base pins are current — no drift." >> "$GITHUB_STEP_SUMMARY"
